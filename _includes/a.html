{% assign first_char = include.href | strip | slice: 0, 1 %}
{% assign protocol = include.href | strip | slice: 0, 4 %}
<a href="{% if protocol == 'http' %}{{ include.href }}{% elsif first_char == '/' %}{{ include.href }}{% else %}/{{ site.baseurl }}/{{ include.href }}{% endif %}" target="_blank" class="{{ include.class }}">
